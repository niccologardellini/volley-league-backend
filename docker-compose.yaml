services:
  db:
    image: mysql:8.0
    container_name: mysql_webapp
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: webapp
      MYSQL_USER: webappuser
      MYSQL_PASSWORD: webapppassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwebappuser", "-pwebapppassword"]
      interval: 5s
      retries: 20

  # Backend containerizzato (facoltativo): docker compose --profile full up -d
  backend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: relazione_esame/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/webapp
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
